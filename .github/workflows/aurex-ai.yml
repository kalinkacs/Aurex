name: Aurex AI issue agent
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurex-ai.yml'
  schedule:
    - cron: '17 13 * * 1-5'
permissions:
  contents: read
  issues: write
  models: read
concurrency:
  group: aurex-ai-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate agent
        run: python -m py_compile aurex_ai_agent.py aurex_http_diagnostics.py
      - name: Run offline agent tests
        run: python -m unittest discover -s tests -p 'test_aurex*.py' -v
      - name: Confirm runtime and permissions
        run: |
          echo "event=${{ github.event_name }} repository=${{ github.repository }}"
          python --version
      - name: Analyze issue with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUREX_MODEL: openai/gpt-4o-mini
          AUREX_ISSUE_NUMBER: '19'
        run: python aurex_ai_agent.py

  autonomous-healthcheck:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify agent without network or secrets
        run: |
          python -m py_compile aurex_ai_agent.py aurex_http_diagnostics.py
          python -m unittest discover -s tests -p 'test_aurex*.py' -v
