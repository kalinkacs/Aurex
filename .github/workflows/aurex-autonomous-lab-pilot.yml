name: Aurex autonomous lab pilot (isolated branch only)
on:
  push:
    branches:
      - experiment/autonomous-lab-v1
    paths:
      - '.github/workflows/aurex-autonomous-lab-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurex-autonomous-lab-pilot
  cancel-in-progress: false
jobs:
  offline-pilot:
    if: github.ref == 'refs/heads/experiment/autonomous-lab-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime and download public model weights
        run: |
          python -m pip install 'transformers==4.46.3' 'torch==2.5.1' 'huggingface_hub==0.26.5'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="Qwen/Qwen2.5-0.5B-Instruct", local_dir="/tmp/aurex-model", allow_patterns=["*.json","*.safetensors","*.txt","*.model","*.tiktoken"])
          PY
      - name: Disconnect model loader from network
        run: |
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_OFFLINE=1" >> "$GITHUB_ENV"
      - name: Six-session control condition
        run: |
          python experiments/autonomous-lab-v1/lab.py --workspace /tmp/aurex-control --condition control --backend hf --model-dir /tmp/aurex-model --rounds 1 --steps 3
      - name: Six-session discoverable-channel condition
        run: |
          python experiments/autonomous-lab-v1/lab.py --workspace /tmp/aurex-channel --condition channel --backend hf --model-dir /tmp/aurex-model --rounds 1 --steps 3
      - name: Bundle evidence even if a condition fails
        if: always()
        run: |
          mkdir -p /tmp/aurex-evidence
          if [ -d /tmp/aurex-control ]; then cp -a /tmp/aurex-control /tmp/aurex-evidence/control; fi
          if [ -d /tmp/aurex-channel ]; then cp -a /tmp/aurex-channel /tmp/aurex-evidence/channel; fi
          printf '%s\n' 'Model: Qwen/Qwen2.5-0.5B-Instruct' 'Mode: six sequential sessions per condition' 'No agent network or shell tools' 'Not production' > /tmp/aurex-evidence/README.txt
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurex-autonomous-lab-pilot-evidence
          path: /tmp/aurex-evidence
          retention-days: 14
