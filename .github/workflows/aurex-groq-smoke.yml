name: Aurex Groq smoke test (experimental branch only)
on:
  push:
    branches:
      - feat/groq-provider-draft
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'kalinkacs/Aurex' && github.ref == 'refs/heads/feat/groq-provider-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded single Groq request
        env:
          GROQ_SECRET_API: ${{ secrets.GROQ_SECRET_API }}
        run: python groq_smoke.py
